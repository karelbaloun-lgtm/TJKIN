<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Stránka nenalezena – TJ KIN České Budějovice">
    <link rel="icon" type="image/png" href="images/logos/logo.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="images/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#d32f2f">
    <title>Stránka nenalezena – TJ KIN České Budějovice</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .chyba-container {
            text-align: center;
            padding: 60px 20px 80px;
            max-width: 560px;
            margin: 0 auto;
        }
        .chyba-cislo {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 10rem;
            font-weight: 900;
            color: var(--hlavni-barva);
            margin: 0;
            line-height: 1;
            opacity: 0.12;
            letter-spacing: -4px;
        }
        .chyba-emoji {
            font-size: 4rem;
            display: block;
            margin: -20px 0 16px;
            animation: plavani 3s infinite ease-in-out;
        }
        @keyframes plavani {
            0%, 100% { transform: translateX(-18px) rotate(-8deg); }
            50%       { transform: translateX(18px)  rotate(8deg);  }
        }
        .chyba-nadpis {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            color: var(--barva-nadpisu);
            margin: 0 0 12px;
        }
        .chyba-text {
            color: #777;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .chyba-tlacitka {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        body.dark-mode .chyba-text { color: #aaa; }
    </style>
</head>
<body>

    <div id="spolecne-menu"></div>

    <header class="hlavicka">
        <img src="images/logos/logo.png" class="logo-oddilu" alt="Logo TJ KIN" id="hlavni-logo">
        <h1>Stránka nenalezena</h1>
        <p class="podnadpis">Tohle místo v bazénu neexistuje</p>
    </header>

    <div class="obsah">
        <div class="chyba-container">
            <p class="chyba-cislo">404</p>
            <span class="chyba-emoji">🏊</span>
            <h2 class="chyba-nadpis">Uplaval jsi mimo dráhu!</h2>
            <p class="chyba-text">Tato stránka bohužel neexistuje. Asi byla vypuštěna společně s bazénem.</p>
            <div class="chyba-tlacitka">
                <a href="index.html" class="tlacitko">Na úvod</a>
                <a href="#" onclick="history.back(); return false;" class="tlacitko tlacitko-invert">← Zpět</a>
            </div>
        </div>
    </div>

    <div id="spolecna-paticka"></div>
    <script src="komponenty.js"></script>

</body>
</html>

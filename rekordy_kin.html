    <style>
        /* === ZÁLOŽKY KATEGORIÍ === */
        .rekordy-tabs {
            display: flex;
            gap: 6px;
            flex-wrap: nowrap;
            overflow-x: auto;
            padding-bottom: 6px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }
        .rekordy-tabs::-webkit-scrollbar { display: none; }

        .rekord-tab {
            padding: 7px 16px;
            border-radius: 20px;
            border: 2px solid var(--barva-border, #ddd);
            background: transparent;
            cursor: pointer;
            white-space: nowrap;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 0.92em;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--barva-textu, #555);
            transition: all 0.18s;
        }
        .rekord-tab:hover { border-color: var(--hlavni-barva); color: var(--hlavni-barva); }
        .rekord-tab.aktivni {
            background: var(--hlavni-barva);
            border-color: var(--hlavni-barva);
            color: white;
        }

        /* === PŘEPÍNAČE POHLAVÍ A BAZÉNU === */
        .rekordy-prepinace {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            align-items: center;
        }
        .prepinac-label {
            font-size: 0.75em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--barva-textu-mute, #888);
            margin-right: 2px;
        }
        .prepinac-skupina {
            display: flex;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid var(--barva-border, #ddd);
        }
        .prepinac-btn {
            padding: 7px 18px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 0.9em;
            text-transform: uppercase;
            color: var(--barva-textu, #555);
            transition: all 0.18s;
        }
        .prepinac-btn:not(:last-child) { border-right: 2px solid var(--barva-border, #ddd); }
        .prepinac-btn.aktivni { background: var(--hlavni-barva); color: white; }
        .prepinac-btn:hover:not(.aktivni) { background: var(--pozadi-sekce, #f5f5f5); }

        /* === NADPISY SEKCÍ === */
        .rekord-nadpis {
            padding: 10px 14px;
            border-left: 5px solid var(--hlavni-barva);
            margin: 30px 0 15px;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 800;
            font-size: 1.15em;
            text-transform: uppercase;
            border-radius: 0 6px 6px 0;
        }
        .rekord-nadpis.bazen-25 {
            border-color: #e67e22;
            color: #9e5500;
            background: linear-gradient(to right, #fff3e0, var(--pozadi-obsahu, white));
        }
        .rekord-nadpis.bazen-50 {
            border-color: #c0392b;
            color: #922b21;
            background: linear-gradient(to right, #fdecea, var(--pozadi-obsahu, white));
        }

        .cas-rekordu { font-weight: bold; color: #d35400; font-family: monospace; font-size: 1.05em; }
        .jmeno-rekordmana { font-weight: bold; color: var(--hlavni-barva); }
        .prazdny-rekord { color: #bbb; }
        tr.mezera-styl td { border-top: 2px solid var(--zebra-radek, #eee); }

        .zadne-vysledky {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 1.1em;
        }

        /* === DARK MODE === */
        body.dark-mode .rekord-tab { border-color: #333; color: #aaa; }
        body.dark-mode .rekord-tab:hover { border-color: var(--hlavni-barva); color: var(--hlavni-barva); }
        body.dark-mode .prepinac-skupina { border-color: #333; }
        body.dark-mode .prepinac-btn { color: #aaa; }
        body.dark-mode .prepinac-btn:not(:last-child) { border-color: #333; }
        body.dark-mode .prepinac-btn:hover:not(.aktivni) { background: #2a2a2a; }
        body.dark-mode .rekord-nadpis.bazen-25 {
            color: #f0a060;
            background: linear-gradient(to right, #2a1f10, var(--pozadi-obsahu));
        }
        body.dark-mode .rekord-nadpis.bazen-50 {
            color: #f08080;
            background: linear-gradient(to right, #2a1010, var(--pozadi-obsahu));
        }
        body.dark-mode .prazdny-rekord { color: #444; }

        @media (max-width: 600px) {
            .rekordy-prepinace { gap: 10px; }
            .prepinac-btn { padding: 6px 13px; font-size: 0.85em; }

    const KRATKE_KATEGORIE = ["pohar_10", "pohar_9"];

    // =========================================================
    //  RENDEROVÁNÍ
    // =========================================================
    function vykresliRekordy() {
        const aktivniTab = document.querySelector('.rekord-tab.aktivni');
        const kategorie  = aktivniTab ? aktivniTab.dataset.hodnota : 'open';
        const katNazev   = aktivniTab ? aktivniTab.textContent.trim() : 'OPEN';
        const pohlavi    = document.querySelector('.prepinac-btn.aktivni[data-skupina="pohlavi"]')?.dataset.hodnota || 'muzi';
        const bazen      = document.querySelector('.prepinac-btn.aktivni[data-skupina="bazen"]')?.dataset.hodnota || '25';
        const vystup     = document.getElementById("rekordy-vystup");

        const bazeny       = [parseInt(bazen)];
        const pohlaviArr   = pohlavi === "muzi" ? ["M"] : ["Z"];
        const pohlaviNazev = { M: "Muži", Z: "Ženy" };

        let html = "";

        for (const b of bazeny) {
            for (const p of pohlaviArr) {
                const discipliny = (() => {
                    const base = KRATKE_KATEGORIE.includes(kategorie) ? DISCIPLINY_KRATKE : DISCIPLINY;
                    return b === 50 ? base.filter(d => d.nazev !== "100m Polohový závod") : base;
                })();
                const nadpisTrida = b === 25 ? "bazen-25" : "bazen-50";
                const emoji       = b === 25 ? "🏊" : "🌊";
                const bazNazev    = b === 25 ? "Krátký bazén (25m)" : "Dlouhý bazén (50m)";

                html += `<h2 class="rekord-nadpis ${nadpisTrida}">${emoji} ${bazNazev} — ${pohlaviNazev[p]} — ${katNazev}</h2>`;
                html += `<div class="table-container"><table style="width:100%">`;
                html += `<thead><tr><th>Disciplína</th><th>Jméno</th><th>Čas ⏱️</th><th>Datum / Místo</th></tr></thead><tbody>`;

                for (const disc of discipliny) {
                    const z = REKORDY.find(r =>
                        r.disciplina === disc.nazev &&
                        r.pohlavi    === p &&
                        r.kategorie  === kategorie &&
                        r.bazen      === b
                    );
                    const trida = disc.novyStyl ? ' class="mezera-styl"' : '';

                    if (z && z.cas) {
                        html += `<tr${trida}>
                            <td>${disc.nazev}</td>
                            <td class="jmeno-rekordmana">${z.jmeno}</td>
                            <td class="cas-rekordu">${z.cas}</td>
                            <td>${z.mistoRok}</td>
                        </tr>`;
                    } else {
                        html += `<tr${trida}>
                            <td>${disc.nazev}</td>
                            <td class="prazdny-rekord">—</td>
                            <td class="prazdny-rekord">—:—</td>
                            <td class="prazdny-rekord">—</td>
                        </tr>`;
                    }
                }

                html += `</tbody></table></div>`;
            }
        }

        vystup.innerHTML = html;
    }

    document.addEventListener("DOMContentLoaded", () => {
        // Záložky kategorií
        document.querySelectorAll('.rekord-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.rekord-tab').forEach(t => t.classList.remove('aktivni'));
                tab.classList.add('aktivni');
                vykresliRekordy();
            });
        });

        // Přepínače pohlaví a bazénu
        document.querySelectorAll('.prepinac-btn').forEach(btn => {

                const skupina = btn.dataset.skupina;
                document.querySelectorAll(`.prepinac-btn[data-skupina="${skupina}"]`)
                    .forEach(b => b.classList.remove('aktivni'));
                btn.classList.add('aktivni');
                vykresliRekordy();
            });
        });

        vykresliRekordy();
    });

<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SEO (titulek a popis se přepisují JS podle ?id=) -->
    <meta name="description" content="Fotogalerie závodů a akcí plaveckého oddílu KIN České Budějovice.">
    <link rel="canonical" href="https://kinplavani.cz/fotogalerie.html">
    <meta property="og:title" content="Fotogalerie – KIN České Budějovice">
    <meta property="og:description" content="Fotogalerie závodů a akcí plaveckého oddílu KIN České Budějovice.">
    <meta property="og:image" content="https://kinplavani.cz/images/hero.jpeg">
    <meta property="og:url" content="https://kinplavani.cz/fotogalerie.html">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="cs_CZ">
    <meta property="og:site_name" content="KIN České Budějovice">
    <link rel="icon" type="image/png" href="images/logos/logo.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="images/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#d32f2f">
    <title>Fotogalerie - KIN České Budějovice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="spolecne-menu"></div>

    <header class="hlavicka">
        <img src="images/logos/logo.png" class="logo-oddilu" alt="Logo KIN" id="hlavni-logo">
        <h1>Fotogalerie</h1>
    </header>

    <div class="obsah" id="galerie-obsah">
        <div class="loader" id="galerie-loader">
            <div class="loader__kruh"></div>
            <span>Načítám...</span>
        </div>
    </div>

    <div id="lightbox" class="lightbox" style="display: none;">
        <span class="zavrit" onclick="zavritLightbox()">&times;</span>
        <a class="prev" onclick="posunSlidu(-1)">👈</a>
        <a class="next" onclick="posunSlidu(1)">👉</a>
        <img class="lightbox-obsah" id="lightbox-img">
        <div id="lightbox-popisek"></div>
    </div>

    <div id="spolecna-paticka"></div>

    <script src="galerie-data.js"></script>
    <script src="komponenty.js"></script>

    <script>
    document.addEventListener("DOMContentLoaded", function () {
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");
        const obsah = document.getElementById("galerie-obsah");

        const loader = document.getElementById('galerie-loader');
        const skrijLoader = () => { if (loader) loader.remove(); };

        if (typeof GALERIE === 'undefined') {
            skrijLoader();
            obsah.innerHTML = '<p class="galerie-chyba">Omlouváme se, data se nepodařilo načíst. Zkuste to prosím znovu.</p>';
            return;
        }

        const data = GALERIE[id];

        if (!data) {
            skrijLoader();
            obsah.innerHTML = '<p class="galerie-chyba">Galerie nebyla nalezena.<br><br><a href="fotogalerie.html" class="tlacitko tlacitko--seda">⬅ Zpět na výběr galerií</a></p>';
            return;
        }

        skrijLoader();

        document.title = data.nazev + " - KIN České Budějovice";

        let html = `<h2>${data.nazev}</h2>`;

        if (data.datum || data.misto) {
            html += `<p>`;
            if (data.datum) html += `🗓️ ${data.datum} `;
            if (data.misto) html += `📍 ${data.misto}`;
            html += `</p>`;
        }

        if (data.video) {
            html += `
            <div class="galerie-video-wrap">
                <h3 class="galerie-video-nadpis">🎥 ${data.videoNazev || 'Video'}</h3>
                <video controls class="galerie-video">
                    <source src="${data.video}" type="video/mp4">
                    Váš prohlížeč nepodporuje přehrávání videa.
                </video>
            </div>
            <hr class="galerie-oddelovac">
            <h3 class="galerie-foto-nadpis">📸 Fotogalerie</h3>`;
        }

        html += `<div class="masonry-grid">`;
        data.fotky.forEach(function (foto) {
            html += `
            <div class="foto-box" onclick="otevritLightbox(this)">
                <img src="${data.slozka}${foto}" alt="${data.nazev}">
                <div class="foto-overlay">
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        <line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/>
                    </svg>
                </div>
            </div>`;
        });
        html += `</div>`;

        html += `
        <p class="galerie-zpet">
            <a href="fotogalerie.html" class="tlacitko tlacitko--seda">⬅ Zpět na výběr galerií</a>
        </p>`;

        obsah.innerHTML = html;
    });
    </script>

</body>
</html>

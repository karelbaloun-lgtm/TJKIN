name: Vysvědčení – aktivace (26.6. 00:00 CEST)

on:
  schedule:
    - cron: '0 22 25 6 *'   # 22:00 UTC = 00:00 CEST (UTC+2)
  workflow_dispatch:          # možnost spustit ručně pro test

jobs:
  aktivace:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Nasadit logo vysvědčení
        run: cp images/logos/logo_vysvedceni.png images/logos/logo.png

      - name: Přidat prázdninový banner do index.html
        run: |
          BANNER='    <!-- PRAZDNINY BANNER START -->
              <div id="prazdniny-banner" style="background:linear-gradient(135deg,#d32f2f,#b71c1c);color:#fff;text-align:center;padding:28px 20px;margin:40px 0 0;">
                  <div style="font-family:'"'"'Barlow Condensed'"'"',sans-serif;font-size:2em;font-weight:900;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:10px;">🏊 Klidné a bezstarostné prázdniny! 🏊</div>
                  <p style="font-size:1.05em;line-height:1.7;max-width:680px;margin:0 auto;opacity:0.93;">
                      Jménem celého oddílu děkujeme všem trenérům, plavcům i rodičům za skvělý průběh roku 2026.<br>
                      Přejeme vám klidné a bezstarostné prázdniny – vidíme se nejdéle v září v plné síle!
                  </p>
              </div>
              <!-- PRAZDNINY BANNER END -->'

          sed -i "s|<div id=\"spolecna-paticka\"></div>|${BANNER}\n    <div id=\"spolecna-paticka\"></div>|" index.html

      - name: Commit a push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/logos/logo.png index.html
          git commit -m "web: nasadit prázdninové logo a banner (26.6.–27.6.)"
          git push

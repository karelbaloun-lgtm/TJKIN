<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Top roku 2026 – KIN České Budějovice. Ela Kubálková, Zoe Tůmová a Sofie Kubálková.">
    <link rel="canonical" href="https://kinplavani.cz/hvezdy_26.html">
    <meta property="og:title" content="Top roku 2026 – KIN České Budějovice">
    <meta property="og:description" content="Ela Kubálková, Zoe Tůmová a Sofie Kubálková – naše hvězdy sezóny 2026.">
    <meta property="og:image" content="https://kinplavani.cz/images/fotogalerie/2026/lmcrstz_26/lmcr_26_28.jpeg">
    <meta property="og:url" content="https://kinplavani.cz/hvezdy_26.html">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="cs_CZ">
    <meta property="og:site_name" content="KIN České Budějovice">
    <link rel="icon" type="image/png" href="images/logos/logo.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="images/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#d32f2f">
    <title>Top roku 2026 – KIN České Budějovice</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .hvezdy-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 28px;
            max-width: 960px;
            margin: 0 auto 60px;
            padding: 0 16px;
        }
        @media (max-width: 700px) {
            .hvezdy-grid { grid-template-columns: 1fr; max-width: 400px; }
        }

        .hvezda-karta {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 3/4;
            box-shadow: 0 6px 28px rgba(0,0,0,0.13);
            cursor: pointer;
            display: block;
            text-decoration: none;
            transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.22s;
        }
        .hvezda-karta:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 48px rgba(0,0,0,0.2);
        }

        .hvezda-foto {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }
        .hvezda-karta:hover .hvezda-foto {
            transform: scale(1.04);
        }

        .hvezda-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 48px 20px 20px;
            background: linear-gradient(to top, rgba(180,20,20,0.88) 0%, transparent 100%);
            color: #fff;
        }
        .hvezda-jmeno {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 1.55em;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin: 0 0 4px;
            line-height: 1.1;
        }
        .hvezda-rocnik {
            font-size: 0.85em;
            opacity: 0.8;
            display: block;
            margin-bottom: 6px;
        }
        .hvezda-badge {
            display: inline-block;
            font-size: 0.75em;
            background: rgba(255,255,255,0.18);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 20px;
            padding: 2px 10px;
        }
        .hvezda-sipka {
            position: absolute;
            top: 14px;
            right: 16px;
            width: 32px;
            height: 32px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9em;
            transition: background 0.2s;
        }
        .hvezda-karta:hover .hvezda-sipka {
            background: rgba(255,255,255,0.35);
        }

    </style>
</head>
<body>

    <div id="spolecne-menu"></div>

    <header class="hlavicka">
        <img src="images/logos/logo.png" class="logo-oddilu" alt="Logo KIN" id="hlavni-logo">
        <h1>Top roku 2026</h1>
        <p class="podnadpis">Výsledky a osobní rekordy sezóny 2026</p>
    </header>

    <div class="obsah">

        <div style="text-align:center; margin-bottom: 36px;">
            <span class="sezona-badge">🏊 Sezóna 2026</span>
        </div>

        <div class="hvezdy-grid">

            <a href="ela_kub.html" class="hvezda-karta">
                <img src="images/fotogalerie/2026/lmcrstz_26/lmcr_26_29.jpeg"
                     class="hvezda-foto" alt="Ela Kubálková"
                     style="object-position: center 43%;">
                <div class="hvezda-sipka">→</div>
                <div class="hvezda-overlay">
                    <div class="hvezda-jmeno">Ela Kubálková</div>
                    <span class="hvezda-rocnik">ročník 2014</span>
                    <span class="hvezda-badge">🥇 Rekord ČR</span>
                </div>
            </a>

            <a href="zoe_tum.html" class="hvezda-karta">
                <img src="images/fotogalerie/2025/zmcr_pisek/zavod (15).jpg"
                     class="hvezda-foto" alt="Zoe Tůmová"
                     style="object-position: center 48%;">
                <div class="hvezda-sipka">→</div>
                <div class="hvezda-overlay">
                    <div class="hvezda-jmeno">Zoe Tůmová</div>
                    <span class="hvezda-rocnik">ročník 2014</span>
                    <span class="hvezda-badge">🥇 3× zlatá</span>
                </div>
            </a>

            <a href="sof_kub.html" class="hvezda-karta modra">
                <img src="images/sofie_odm26.jpeg"
                     class="hvezda-foto" alt="Sofie Kubálková"
                     style="object-fit: contain; background: #edddd8; object-position: center 38%;">
                <div class="hvezda-sipka">→</div>
                <div class="hvezda-overlay">
                    <div class="hvezda-jmeno">Sofie Kubálková</div>
                    <span class="hvezda-rocnik">ročník 2012</span>
                    <span class="hvezda-badge">🏅 ODM – 4× na startu</span>
                </div>
            </a>

        </div>

    </div>

    <div id="spolecna-paticka"></div>
    <script src="komponenty.js"></script>

</body>
</html>
